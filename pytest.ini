[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
testpaths = apps
# --ds vence a ENV DJANGO_SETTINGS_MODULE do container (config.settings), que
# por sua vez vence a linha acima (precedência do pytest-django: cmdline > env
# > ini). Sem isto, `docker exec ... pytest` roda a suíte com settings de
# PRODUÇÃO: sem CELERY_TASK_ALWAYS_EAGER (nenhuma task .delay roda nos testes)
# e com channel layer no Redis REAL - foi assim que 4 testes do inbox ficaram
# vermelhos e a suíte "verde" mascarou tasks que nunca executavam (27/07/2026).
addopts = -q --ds=config.settings_test
